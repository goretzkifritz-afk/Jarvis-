<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    overflow: hidden;
    background:
        radial-gradient(circle at center, #062b3c 0%, #020b12 35%, #000 75%);
    color: #9eeeff;
    font-family: Arial, Helvetica, sans-serif;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
        linear-gradient(rgba(0,220,255,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,220,255,.035) 1px, transparent 1px);
    background-size: 35px 35px;
    pointer-events: none;
}

.container {
    width: 100%;
    max-width: 900px;
    height: 100vh;
    margin: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 25px 15px;
}

.title {
    font-size: clamp(32px, 9vw, 70px);
    letter-spacing: 12px;
    font-weight: 300;
    text-shadow:
        0 0 8px #00d9ff,
        0 0 25px #00a8ff;
    margin-top: 10px;
}

.status {
    margin-top: 5px;
    font-size: 11px;
    letter-spacing: 5px;
    color: #63eaff;
    opacity: .8;
}

.core {
    position: relative;
    width: min(70vw, 300px);
    height: min(70vw, 300px);
    margin: 35px auto 20px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
}

.ring {
    position: absolute;
    border-radius: 50%;
    border: 2px solid rgba(0,220,255,.65);
    box-shadow:
        0 0 12px #00d9ff,
        inset 0 0 12px #00d9ff;
}

.ring.one {
    width: 100%;
    height: 100%;
    animation: spin 10s linear infinite;
}

.ring.two {
    width: 78%;
    height: 78%;
    border-style: dashed;
    animation: spinReverse 7s linear infinite;
}

.ring.three {
    width: 57%;
    height: 57%;
    animation: pulse 2s ease-in-out infinite;
}

.inner {
    width: 35%;
    height: 35%;
    border-radius: 50%;
    background: radial-gradient(circle, #dfffff 0%, #21dcff 25%, #007fa5 55%, #00141e 100%);
    box-shadow:
        0 0 20px #00d9ff,
        0 0 55px #00bfff,
        0 0 100px rgba(0,200,255,.6);
    animation: corePulse 2s ease-in-out infinite;
}

@keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

@keyframes spinReverse {
    from { transform: rotate(360deg); }
    to { transform: rotate(0deg); }
}

@keyframes pulse {
    0%,100% { transform: scale(.96); opacity: .65; }
    50% { transform: scale(1.04); opacity: 1; }
}

@keyframes corePulse {
    0%,100% { transform: scale(.9); }
    50% { transform: scale(1.08); }
}

.panel {
    width: 100%;
    max-width: 650px;
    height: 280px;
    border: 1px solid rgba(0,220,255,.4);
    background: rgba(0,15,23,.65);
    box-shadow:
        0 0 20px rgba(0,200,255,.12),
        inset 0 0 30px rgba(0,200,255,.05);
    backdrop-filter: blur(8px);
    border-radius: 15px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.chat {
    flex: 1;
    overflow-y: auto;
    padding: 15px;
}

.message {
    margin-bottom: 12px;
    line-height: 1.45;
    font-size: 14px;
}

.jarvis {
    color: #71eaff;
}

.user {
    color: #ffffff;
    text-align: right;
}

.controls {
    display: flex;
    gap: 8px;
    padding: 10px;
    border-top: 1px solid rgba(0,220,255,.25);
}

input {
    flex: 1;
    min-width: 0;
    padding: 12px;
    border: 1px solid rgba(0,220,255,.4);
    background: rgba(0,0,0,.5);
    color: white;
    outline: none;
    border-radius: 8px;
}

button {
    border: 1px solid rgba(0,220,255,.6);
    background: rgba(0,120,160,.18);
    color: #9eeeff;
    padding: 10px 14px;
    border-radius: 8px;
    cursor: pointer;
    transition: .2s;
}

button:hover {
    background: rgba(0,200,255,.25);
    box-shadow: 0 0 15px rgba(0,220,255,.35);
}

.quick {
    display: flex;
    gap: 7px;
    padding: 0 10px 10px;
    overflow-x: auto;
}

.quick button {
    white-space: nowrap;
    font-size: 11px;
}

.footer {
    margin-top: 12px;
    font-size: 10px;
    opacity: .45;
    letter-spacing: 2px;
}
</style>
</head>

<body>

<div class="container">

    <div class="title">JARVIS</div>
    <div class="status" id="status">SYSTEM ONLINE</div>

    <div class="core">
        <div class="ring one"></div>
        <div class="ring two"></div>
        <div class="ring three"></div>
        <div class="inner"></div>
    </div>

    <div class="panel">

        <div class="chat" id="chat">
            <div class="message jarvis">
                JARVIS: Systeme online. Guten Tag.
            </div>
        </div>

        <div class="quick">
            <button onclick="command('Wie spät ist es?')">TIME</button>
            <button onclick="command('Welches Datum ist heute?')">DATE</button>
            <button onclick="command('Systemstatus')">STATUS</button>
            <button onclick="command('Hallo Jarvis')">HELLO</button>
        </div>

        <div class="controls">
            <input
                id="input"
                type="text"
                placeholder="Befehl eingeben..."
                autocomplete="off"
            >
            <button onclick="send()">SEND</button>
            <button onclick="microphone()">🎙️</button>
        </div>

    </div>

    <div class="footer">
        JARVIS AI SYSTEM
    </div>

</div>

<script>

const chat = document.getElementById("chat");
const input = document.getElementById("input");
const statusText = document.getElementById("status");

let selectedVoice = null;


/* =========================
   STIMME AUSWÄHLEN
========================= */

function loadVoice() {

    const voices = speechSynthesis.getVoices();

    if (!voices.length) return;

    const germanVoices = voices.filter(v =>
        v.lang && v.lang.toLowerCase().startsWith("de")
    );

    /*
       Wir bevorzugen Stimmen, deren Namen oft
       männlicher/tiefer klingen.
    */

    const preferredNames = [
        "Markus",
        "Mark",
        "Martin",
        "Hans",
        "Daniel",
        "Thomas",
        "Stefan",
        "Google Deutsch",
        "Microsoft Conrad",
        "Microsoft Stefan"
    ];

    for (const preferred of preferredNames) {

        const found = germanVoices.find(v =>
            v.name.toLowerCase().includes(preferred.toLowerCase())
        );

        if (found) {
            selectedVoice = found;
            return;
        }
    }

    /*
       Falls keine passende gefunden wird:
       irgendeine deutsche Stimme verwenden.
    */

    selectedVoice = germanVoices[0] || voices[0];
}

speechSynthesis.onvoiceschanged = loadVoice;
loadVoice();


/* =========================
   CHAT
========================= */

function addMessage(text, type) {

    const div = document.createElement("div");

    div.className = "message " + type;

    div.textContent =
        type === "jarvis"
        ? "JARVIS: " + text
        : "DU: " + text;

    chat.appendChild(div);

    chat.scrollTop = chat.scrollHeight;
}


/* =========================
   SPRACHE
========================= */

function speak(text) {

    if (!("speechSynthesis" in window)) return;

    speechSynthesis.cancel();

    const speech = new SpeechSynthesisUtterance(text);

    loadVoice();

    if (selectedVoice) {
        speech.voice = selectedVoice;
    }

    speech.lang = "de-DE";

    /*
       Tiefer / ruhiger JARVIS-Stil.
       Der Browser entscheidet aber,
       wie tief die jeweilige Stimme tatsächlich klingt.
    */

    speech.rate = 0.88;
    speech.pitch = 0.72;
    speech.volume = 1;

    speech.onstart = () => {
        statusText.textContent = "JARVIS SPEAKING";
    };

    speech.onend = () => {
        statusText.textContent = "SYSTEM ONLINE";
    };

    speechSynthesis.speak(speech);
}


/* =========================
   JARVIS LOGIK
========================= */

function jarvisAnswer(commandText) {

    const text = commandText.toLowerCase().trim();

    if (
        text.includes("hallo") ||
        text.includes("hi") ||
        text.includes("hey")
    ) {
        return "Guten Tag. JARVIS ist bereit.";
    }

    if (
        text.includes("wer bist du") ||
        text.includes("was bist du")
    ) {
        return "Ich bin JARVIS, dein persönlicher digitaler Assistent.";
    }

    if (
        text.includes("zeit") ||
        text.includes("wie spät")
    ) {

        return "Es ist " +
            new Date().toLocaleTimeString("de-DE", {
                hour: "2-digit",
                minute: "2-digit"
            }) +
            " Uhr.";
    }

    if (
        text.includes("datum") ||
        text.includes("welcher tag")
    ) {

        return "Heute ist " +
            new Date().toLocaleDateString("de-DE", {
                weekday: "long",
                day: "2-digit",
                month: "long",
                year: "numeric"
            }) +
            ".";
    }

    if (
        text.includes("status") ||
        text.includes("system")
    ) {
        return "Alle Systeme arbeiten innerhalb normaler Parameter.";
    }

    if (
        text.includes("danke") ||
        text.includes("thanks")
    ) {
        return "Gern geschehen.";
    }

    if (
        text.includes("hilfe")
    ) {
        return "Ich kann aktuell Uhrzeit, Datum und Systemstatus anzeigen. Weitere Funktionen können später ergänzt werden.";
    }

    /*
       WICHTIG:
       Kein nerviges "Befehl empfangen..."
       mehr.
    */

    return "Ich habe dich verstanden. Diese Funktion ist in meiner aktuellen Version noch nicht aktiviert.";
}


/* =========================
   SEND
========================= */

function send() {

    const text = input.value.trim();

    if (!text) return;

    command(text);

    input.value = "";
}


/* =========================
   COMMAND
========================= */

function command(text) {

    addMessage(text, "user");

    const answer = jarvisAnswer(text);

    setTimeout(() => {

        addMessage(answer, "jarvis");

        speak(answer);

    }, 300);
}


/* =========================
   ENTER
========================= */

input.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
        send();
    }

});


/* =========================
   MIKROFON
========================= */

function microphone() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!SpeechRecognition) {

        addMessage(
            "Die Sprachsteuerung wird von diesem Browser nicht unterstützt.",
            "jarvis"
        );

        return;
    }

    const recognition = new SpeechRecognition();

    recognition.lang = "de-DE";
    recognition.interimResults = false;
    recognition.continuous = false;

    statusText.textContent = "LISTENING...";

    recognition.start();

    recognition.onresult = function(event) {

        const text =
            event.results[0][0].transcript;

        input.value = text;

        command(text);

    };

    recognition.onerror = function() {

        statusText.textContent = "SYSTEM ONLINE";

    };

    recognition.onend = function() {

        statusText.textContent = "SYSTEM ONLINE";

    };
}


/* =========================
   LIVE CLOCK
========================= */

setInterval(() => {

    document.title =
        "JARVIS • " +
        new Date().toLocaleTimeString(
            "de-DE",
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        );

}, 1000);

</script>

</body>
</html>
